name: Release Orange AI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dateparser python-dotenv requests psutil pillow pydantic cryptography

      - name: Build Python sidecar runtime
        env:
          ORANGE_BUILD_PYTHON: python
        run: |
          python scripts/build_runtime.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build frontend assets
        run: npm run build

      - name: Build Tauri application and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: blAkeHoax
          repo: orange-ai-build
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Orange AI Desktop ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Automated production release of Orange AI Desktop ${{ github.event.inputs.tag || github.ref_name }} with signed auto-updater bundle.'
          releaseDraft: false
          prerelease: false
