name: Release Orange AI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python sidecar runtime
        shell: bash
        run: |
          if [ -d "../Orange AI Desktop" ] || [ -d "../desktop" ] || [ -d "desktop" ]; then
            python scripts/build_runtime.py
          else
            echo "Standalone runtime already bundled in src-tauri/resources/runtime/"
            ls -la src-tauri/resources/runtime/runtime_adapter.exe
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build frontend assets
        run: npm run build

      - name: Ensure release and tag exist on orange-ai-build
        shell: pwsh
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git clone "https://x-access-token:${env:RELEASE_REPO_TOKEN}@github.com/blAkeHoax/orange-ai-build.git" "$env:RUNNER_TEMP\release-repo"
          Set-Location "$env:RUNNER_TEMP\release-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (Test-Path "README.md")) {
            "# Orange AI Desktop — Signed Releases" | Out-File -Encoding utf8 README.md
            git add README.md
            git commit -m "chore: initialize release repository"
            git push origin HEAD:main
          }
          git tag -f "$env:TAG_NAME"
          git push -f origin "$env:TAG_NAME"

          gh release delete "$env:TAG_NAME" --repo blAkeHoax/orange-ai-build --yes 2>$null
          gh release create "$env:TAG_NAME" `
            --repo blAkeHoax/orange-ai-build `
            --target main `
            --title "Orange AI Desktop $env:TAG_NAME" `
            --notes "Automated signed Windows release built from blAkeHoax/orange-ai ($env:GITHUB_SHA)."

      - name: Build Tauri application and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: blAkeHoax
          repo: orange-ai-build
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Orange AI Desktop ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Automated production release of Orange AI Desktop ${{ github.event.inputs.tag || github.ref_name }} with signed auto-updater bundle.'
          releaseDraft: false
          prerelease: false
